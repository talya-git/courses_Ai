<title>AI בסביבת העבודה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed 1920×1080 "screen" scaled to the viewport, dark lab-console look; RTL throughout. Single committed dark world. */
:root {
  color-scheme: dark;
  --ink: #0a0f1e;        /* page / stage ground */
  --deep: #070b16;
  --panel: #111a31;      /* cards */
  --panel2: #16213f;
  --line: rgba(150, 175, 255, 0.16);
  --fg: #eaeef8;
  --muted: #a3afcb;
  --dim: #6f7c9c;
  --accent: #74a9ff;     /* signal blue */
  --accent-2: #f2b45a;   /* warm amber, used sparingly */
  --good: #52d3a7;
  --bad: #ff8a80;
  --f-display: "Secular One", "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", "IBM Plex Sans Hebrew", ui-monospace, monospace;
}
html, body { height: 100%; }
body { background: var(--deep); color: var(--fg); font-family: var(--f-body); overflow: hidden; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
#viewport { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: center center; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); background: var(--ink); }
.slide { position: absolute; inset: 0; direction: rtl; text-align: right; padding: 110px 130px 130px; display: flex; flex-direction: column; gap: 34px; opacity: 0; visibility: hidden; transition: opacity .45s ease, transform .45s ease; transform: translateX(-24px);
  background:
    radial-gradient(900px 600px at 92% -10%, rgba(116,169,255,.13), transparent 60%),
    radial-gradient(700px 500px at -5% 110%, rgba(242,180,90,.07), transparent 60%),
    linear-gradient(var(--ink), var(--ink));
}
.slide::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(150,175,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(150,175,255,.045) 1px, transparent 1px); background-size: 64px 64px; pointer-events: none; mask-image: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.2)); }
.slide.on { opacity: 1; visibility: visible; transform: none; }
.slide > * { position: relative; }
@media (prefers-reduced-motion: reduce) { .slide { transition: none; transform: none; } }

/* chrome */
.foot { position: absolute; left: 130px; right: 130px; bottom: 48px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: var(--dim); letter-spacing: .3px; }
.foot .sec { display: flex; align-items: center; gap: 12px; }
.foot .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.foot .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; direction: ltr; }
.kicker { font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: 1.5px; display: flex; align-items: center; gap: 14px; }
.kicker::before { content: ""; width: 38px; height: 3px; background: var(--accent); border-radius: 2px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 78px; line-height: 1.08; letter-spacing: -.5px; }
h3 { font-family: var(--f-body); font-weight: 700; font-size: 36px; line-height: 1.2; }
p { margin: 0; }
.lead { font-size: 36px; line-height: 1.45; color: var(--muted); max-width: 1450px; }
.head { display: flex; flex-direction: column; gap: 18px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* bullets */
.bul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; font-size: 38px; line-height: 1.4; max-width: 1500px; }
.bul li { display: flex; gap: 22px; align-items: baseline; }
.bul li::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); transform: translateY(-6px) rotate(45deg); }
.bul b { color: var(--fg); }
.bul span.m { color: var(--muted); }

/* cards */
.grid { display: grid; gap: 28px; }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 22px; padding: 34px 36px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card p { font-size: 29px; line-height: 1.45; color: var(--muted); }
.card .ic { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: rgba(116,169,255,.12); color: var(--accent); }
.card .ic svg { width: 36px; height: 36px; }
.card.amber .ic { background: rgba(242,180,90,.12); color: var(--accent-2); }
.card .tag { font-family: var(--f-mono); font-size: 22px; color: var(--accent); direction: ltr; text-align: right; }

/* tool slide */
.tool { display: grid; grid-template-columns: 480px 1fr; gap: 50px; flex: 1; min-height: 0; }
.tool .id { background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 28px; padding: 44px; display: flex; flex-direction: column; gap: 22px; position: relative; overflow: hidden; }
.tool .id::after { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; left: -140px; bottom: -160px; background: radial-gradient(circle, var(--tc), transparent 65%); opacity: .35; }
.mono { width: 132px; height: 132px; border-radius: 34px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 46px; color: var(--ink); background: var(--tc); direction: ltr; }
.tool .name { font-family: var(--f-display); font-size: 70px; line-height: 1; direction: ltr; text-align: right; }
.tool .by { font-size: 26px; color: var(--dim); }
.tool .tagline { font-size: 32px; line-height: 1.4; color: var(--fg); }
.tool .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-content: start; }
.tool .box { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 30px 34px; display: flex; flex-direction: column; gap: 16px; }
.tool .box h3 { font-size: 30px; color: var(--tc); }
.tool .box ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 28px; line-height: 1.4; color: var(--muted); }
.tool .box li::before { content: "•"; color: var(--tc); margin-left: 12px; }
.tool .tip { grid-column: span 2; background: rgba(242,180,90,.08); border: 1px solid rgba(242,180,90,.3); border-radius: 22px; padding: 26px 34px; font-size: 29px; line-height: 1.45; color: var(--fg); }
.tool .tip b { color: var(--accent-2); }

/* table */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 29px; }
.tbl th { text-align: right; font-weight: 600; color: var(--accent); font-size: 26px; padding: 18px 26px; border-bottom: 2px solid var(--line); }
.tbl td { padding: 18px 26px; border-bottom: 1px solid var(--line); color: var(--muted); line-height: 1.35; vertical-align: top; }
.tbl td:first-child { color: var(--fg); font-weight: 600; }
.tbl .pill { display: inline-block; font-size: 24px; padding: 4px 16px; border-radius: 999px; background: rgba(116,169,255,.14); color: var(--accent); margin: 2px 0 2px 8px; direction: ltr; }

/* compare */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.cmp .col { border-radius: 24px; padding: 38px 42px; display: flex; flex-direction: column; gap: 20px; border: 1px solid var(--line); background: var(--panel); }
.cmp .col.good { border-color: rgba(82,211,167,.35); background: linear-gradient(180deg, rgba(82,211,167,.08), var(--panel)); }
.cmp .col.bad { border-color: rgba(255,138,128,.35); background: linear-gradient(180deg, rgba(255,138,128,.08), var(--panel)); }
.cmp h3 { display: flex; gap: 14px; align-items: center; }
.cmp .good h3 { color: var(--good); } .cmp .bad h3 { color: var(--bad); }
.cmp ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; font-size: 30px; line-height: 1.4; color: var(--fg); }
.cmp li { display: flex; gap: 14px; align-items: baseline; }
.cmp .good li::before { content: "✓"; color: var(--good); font-weight: 700; }
.cmp .bad li::before { content: "✕"; color: var(--bad); font-weight: 700; }

/* steps */
.steps { display: grid; gap: 22px; }
.step { display: grid; grid-template-columns: 84px 1fr; gap: 28px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 26px 32px; }
.step .n { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 36px; color: var(--ink); background: var(--accent); }
.step h3 { font-size: 32px; } .step p { font-size: 28px; color: var(--muted); line-height: 1.4; margin-top: 6px; }
.hsteps { display: grid; gap: 22px; }
.hstep { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 30px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.hstep .n { font-family: var(--f-mono); font-size: 26px; color: var(--accent); }
.hstep h3 { font-size: 32px; } .hstep p { font-size: 27px; color: var(--muted); line-height: 1.45; }

/* prompt */
.code { font-family: var(--f-mono); direction: rtl; font-size: 27px; line-height: 1.6; background: #060a14; border: 1px solid var(--line); border-radius: 20px; padding: 30px 36px; color: #d5ddf0; white-space: pre-wrap; }
.code:not(.ltr) { font-family: var(--f-body); font-size: 27px; line-height: 1.5; }
.code.ltr { direction: ltr; text-align: left; font-size: 24px; line-height: 1.55; padding: 26px 32px; }
.code .s { color: #9fd8a8; }
.code .k { color: var(--accent-2); } .code .c { color: var(--dim); } .code .t { color: var(--accent); }
.pp { display: grid; grid-template-columns: 1fr 1.6fr; gap: 34px; align-items: start; }
.pp .lbl { font-size: 26px; font-weight: 600; display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.pp .bad .lbl { color: var(--bad); } .pp .good .lbl { color: var(--good); }
.pp .bad .code { border-color: rgba(255,138,128,.35); } .pp .good .code { border-color: rgba(82,211,167,.35); }
.side { display: flex; flex-direction: column; gap: 18px; }
.chip { display: flex; gap: 16px; align-items: flex-start; font-size: 28px; line-height: 1.4; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px; }
.chip b { color: var(--fg); display: block; }
.chip .sw { flex: none; width: 16px; height: 16px; border-radius: 50%; margin-top: 12px; }

/* statement */
.statement { justify-content: center; align-items: flex-start; gap: 40px; }
.statement .big { font-family: var(--f-display); font-size: 120px; line-height: 1.08; max-width: 1600px; text-wrap: balance; }
.statement .big em { font-style: normal; color: var(--accent); }
.statement .small { font-size: 40px; color: var(--muted); max-width: 1300px; line-height: 1.45; }

/* section divider */
.section { justify-content: center; gap: 30px; background:
  radial-gradient(1000px 700px at 85% 40%, rgba(116,169,255,.22), transparent 60%),
  radial-gradient(600px 400px at 10% 90%, rgba(242,180,90,.10), transparent 60%), var(--ink); }
.section .no { font-family: var(--f-mono); font-size: 34px; color: var(--accent); letter-spacing: 4px; }
.section h2 { font-size: 132px; }
.section .sub { font-size: 40px; color: var(--muted); max-width: 1300px; line-height: 1.4; }
.section .meta { display: flex; gap: 18px; flex-wrap: wrap; }
.section .meta span { font-size: 26px; padding: 10px 22px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg); background: rgba(17,26,49,.6); }
.bignum { position: absolute; left: 90px; bottom: 40px; font-family: var(--f-display); font-size: 560px; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgba(116,169,255,.25); pointer-events: none; }

/* matrix */
.mx { display: grid; grid-template-columns: 70px 1fr 1fr; grid-template-rows: 1fr 1fr 60px; gap: 20px; flex: 1; min-height: 0; }
.mx .q { border-radius: 22px; padding: 30px 34px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--panel); }
.mx .q h3 { font-size: 34px; } .mx .q p { font-size: 27px; color: var(--muted); line-height: 1.4; }
.mx .q.win { background: linear-gradient(160deg, rgba(82,211,167,.16), var(--panel)); border-color: rgba(82,211,167,.4); } .mx .q.win h3 { color: var(--good); }
.mx .q.big { background: linear-gradient(160deg, rgba(116,169,255,.16), var(--panel)); } .mx .q.big h3 { color: var(--accent); }
.mx .q.no h3 { color: var(--bad); }
.mx .ax { display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--dim); }
.mx .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); }

/* flow */
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: nowrap; }
.node { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 26px 26px; display: flex; flex-direction: column; gap: 10px; }
.node .who { font-size: 22px; font-weight: 600; letter-spacing: 1px; display: flex; gap: 10px; align-items: center; }
.node.ai { border-color: rgba(116,169,255,.45); } .node.ai .who { color: var(--accent); }
.node.human { border-color: rgba(242,180,90,.45); } .node.human .who { color: var(--accent-2); }
.node.dec { border-style: dashed; border-color: rgba(82,211,167,.5); } .node.dec .who { color: var(--good); }
.node h3 { font-size: 30px; } .node p { font-size: 25px; color: var(--muted); line-height: 1.4; }
.arrow { flex: none; width: 54px; display: grid; place-items: center; color: var(--dim); }
.arrow svg { width: 40px; height: 40px; }
.legend { display: flex; gap: 30px; font-size: 25px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }

/* exercise */
.ex { display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; flex: 1; min-height: 0; }
.ex .goal { font-size: 34px; line-height: 1.45; color: var(--fg); background: rgba(116,169,255,.08); border: 1px solid rgba(116,169,255,.3); border-radius: 22px; padding: 30px 36px; }
.ex .out { background: rgba(242,180,90,.08); border: 1px solid rgba(242,180,90,.3); border-radius: 22px; padding: 30px 36px; display: flex; flex-direction: column; gap: 14px; }
.ex .out h3 { color: var(--accent-2); font-size: 30px; } .ex .out p { font-size: 28px; color: var(--muted); line-height: 1.45; }
.badge { align-self: flex-start; font-size: 24px; font-weight: 600; color: var(--ink); background: var(--accent-2); padding: 8px 20px; border-radius: 999px; }

/* cover */
.cover { justify-content: center; gap: 36px; padding-right: 150px; }
.cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .eyebrow { font-size: 30px; color: var(--accent); letter-spacing: 2px; font-weight: 600; }
.cover h1 { font-family: var(--f-display); font-size: 150px; line-height: 1.02; max-width: 1300px; }
.cover h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), #b8d2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cover .sub { font-size: 42px; color: var(--muted); max-width: 1150px; line-height: 1.4; }
.cover .row { display: flex; gap: 18px; flex-wrap: wrap; }
.cover .row span { font-size: 28px; padding: 12px 26px; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,15,30,.7); }
.end .big { font-size: 140px; }


.grid.compact { gap: 22px; }
.grid.compact .card { padding: 24px 30px; gap: 8px; }
.grid.compact .card p { font-size: 26px; line-height: 1.4; }
.grid.compact .card h3 { font-size: 32px; }
.grid.compact .card .ic { width: 50px; height: 50px; border-radius: 13px; }
.grid.compact .card .ic svg { width: 28px; height: 28px; }
.hsteps.c5 .hstep { padding: 26px 24px; } .hsteps.c5 .hstep p { font-size: 25px; } .hsteps.c5 .hstep h3 { font-size: 30px; }
.steps .step { padding: 18px 28px; grid-template-columns: 66px 1fr; gap: 24px; align-items: center; }
.steps .step .n { width: 66px; height: 66px; font-size: 30px; }
.steps .step h3 { font-size: 31px; } .steps .step p { font-size: 26px; margin-top: 2px; }
.tool-k { display: flex; justify-content: space-between; align-items: center; }


/* twobox */
.twobox { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.tb { border-radius: 24px; padding: 34px 38px; display: flex; flex-direction: column; gap: 18px; border: 1px solid var(--line); background: var(--panel); }
.tb.good { border-color: rgba(82,211,167,.4); background: linear-gradient(180deg, rgba(82,211,167,.08), var(--panel)); } .tb.good h3 { color: var(--good); }
.tb.bad { border-color: rgba(255,138,128,.4); background: linear-gradient(180deg, rgba(255,138,128,.08), var(--panel)); } .tb.bad h3 { color: var(--bad); }
.tb .say { font-size: 31px; line-height: 1.5; color: var(--fg); font-style: italic; }
.tb .cap { font-size: 27px; line-height: 1.45; color: var(--muted); margin-top: auto; }
.form { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.form div { display: flex; justify-content: space-between; gap: 20px; padding: 14px 22px; font-size: 29px; border-bottom: 1px solid var(--line); background: rgba(6,10,20,.5); }
.form div:last-child { border-bottom: none; } .form span { color: var(--muted); } .form b { color: var(--fg); font-weight: 600; }
/* chat */
.chatwrap { display: grid; grid-template-columns: 1.75fr 1fr; gap: 40px; align-items: start; }
.msgs { display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 88%; padding: 20px 28px; border-radius: 24px; font-size: 28px; line-height: 1.45; display: flex; flex-direction: column; gap: 6px; }
.msg .w { font-size: 21px; font-weight: 600; letter-spacing: .5px; }
.msg.me { align-self: flex-start; background: rgba(116,169,255,.16); border: 1px solid rgba(116,169,255,.4); border-top-right-radius: 6px; } .msg.me .w { color: var(--accent); }
.msg.ai { align-self: flex-end; background: var(--panel2); border: 1px solid var(--line); border-top-left-radius: 6px; } .msg.ai .w { color: var(--accent-2); }
/* lights */
.lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.light { border-radius: 24px; padding: 34px 36px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; border-top: 10px solid var(--lc); }
.light .lamp { width: 54px; height: 54px; border-radius: 50%; background: var(--lc); box-shadow: 0 0 30px var(--lc); }
.light h3 { color: var(--lc); font-size: 34px; } .light > p { font-size: 27px; color: var(--muted); line-height: 1.4; }
.light ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 29px; line-height: 1.4; }
.light li { padding: 12px 18px; border-radius: 14px; background: rgba(6,10,20,.45); }
/* exercise (detailed) */
.exx { display: grid; grid-template-columns: 1.45fr 1fr; gap: 36px; flex: 1; min-height: 0; }
.exx .goal { font-size: 28px; line-height: 1.45; background: rgba(116,169,255,.08); border: 1px solid rgba(116,169,255,.3); border-radius: 20px; padding: 22px 30px; }
.exx .srow { display: grid; grid-template-columns: 112px 1fr; gap: 20px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exx .srow:last-child { border-bottom: none; }
.exx .time { font-family: var(--f-body); font-size: 23px; font-weight: 600; color: var(--ink); background: var(--accent); border-radius: 999px; padding: 6px 0; text-align: center; }
.exx .srow h3 { font-size: 28px; } .exx .srow p { font-size: 24px; color: var(--muted); line-height: 1.4; margin-top: 4px; }
.exx .rbox { border-radius: 20px; padding: 24px 30px; display: flex; flex-direction: column; gap: 12px; }
.exx .rbox.del { background: rgba(242,180,90,.08); border: 1px solid rgba(242,180,90,.35); } .exx .rbox.del h3 { color: var(--accent-2); font-size: 29px; } .exx .rbox.del p { font-size: 27px; line-height: 1.45; }
.exx .rbox.chk { background: rgba(82,211,167,.06); border: 1px solid rgba(82,211,167,.3); } .exx .rbox.chk h3 { color: var(--good); font-size: 29px; }
.exx .rbox.chk ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 26px; }
.exx .rbox.chk li { display: flex; gap: 12px; align-items: center; } .exx .rbox.chk li::before { content: ""; width: 22px; height: 22px; border: 2px solid var(--good); border-radius: 6px; flex: none; }
.node.code { border-color: rgba(200,177,255,.5); } .node.code .who { color: #c8b1ff; }
.node .d { margin-top: auto; font-size: 23px; line-height: 1.4; color: #d7e3ff; background: #060a14; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }

S.push({ t: "promptbox", sec: "p4", ltr: true, kicker: "MCP · דוגמה משלי", title: "בונות שרת MCP משלנו: ספריית המכללה", small: true,
  code: String.raw`from mcp.server import MCPServer
mcp = MCPServer("college-library")

BOOKS = {  # in a real project: the library database
    1: {"title": "Python Crash Course", "copies": 2},
    2: {"title": "Clean Code", "copies": 0},
}

@mcp.tool()
def search_books(query: str) -> dict:
    """Search the college library by book title."""
    return {i: b for i, b in BOOKS.items() if query.lower() in b["title"].lower()}

@mcp.tool()
def is_available(book_id: int) -> str:
    """Check if a book has a free copy to borrow."""
    copies = BOOKS[book_id]["copies"]
    return f"{copies} copies available" if copies else "All copies are taken"

mcp.run()  # Claude runs this file and talks to it`,

/* ======================= RENDER ======================= */
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const KW = /\b(def|return|import|from|class|if|not|else|for|in|async|await|print|True|False|None|flowchart)\b/g;
function hl(code) {
  return code.split("\n").map(line => {
    let q = null, cut = -1;
    for (let i = 0; i < line.length; i++) { const ch = line[i]; if (q) { if (ch === q) q = null; } else if (ch === '"' || ch === "'") q = ch; else if (ch === "#") { cut = i; break; } }
    const codePart = cut >= 0 ? line.slice(0, cut) : line, com = cut >= 0 ? line.slice(cut) : "";
    const strs = []; let c = codePart.replace(/("[^"]*"|'[^']*')/g, m => { strs.push(m); return "\u0000" + (strs.length - 1) + "\u0000"; });
    c = esc(c).replace(KW, '<span class="k">$1</span>').replace(/&lt;(\/?[a-z]+)([^&]*?)&gt;/g, '<span class="t">&lt;$1$2&gt;</span>');
    c = c.replace(/\u0000(\d+)\u0000/g, (_, n) => '<span class="s">' + esc(strs[+n]) + '</span>');
    return c + (com ? '<span class="c">' + esc(com) + '</span>' : "");
  }).join("\n");
}

}

const R = {
  cover: () => `<canvas id="net" aria-hidden="true"></canvas>
    <div class="eyebrow">מסלול מפתחות · אוטומציה חכמה ופיתוח סוכני AI</div>
    <h1>AI בסביבת <em>העבודה</em></h1>
    <p class="sub">מפגשים 1–3: איך מודלים עובדים וכלי הפיתוח המרכזיים, הנדסת פרומפטים למפתחות, וחשיבה ותכנון תהליכי עבודה</p>
    <div class="row"><span>3 מפגשים</span><span>${L("Python · APIs · Agents")}</span><span>${L("Hands-on")}</span></div>`,
  section: s => `<div class="bignum">${s.n}</div><div class="no">${s.no}</div><h2>${s.title}</h2><p class="sub">${s.sub}</p><div class="meta">${s.meta.map(m => `<span>${m}</span>`).join("")}</div>`,
  bullets: s => `${head(s)}<ul class="bul">${s.items.map(x => `<li><span>${x}</span></li>`).join("")}</ul>`,
  cards: s => `${head(s)}<div class="grid${s.cards.length >= 6 || s.compact ? " compact" : ""}" style="grid-template-columns:repeat(${s.cols},1fr)">${s.cards.map((c, k) => `<div class="card${k % 2 && s.cols === 2 ? "" : ""}"><div class="ic">${ic(c.i)}</div>${c.tag ? `<div class="tag">${c.tag}</div>` : ""}<h3>${c.h}</h3><p>${c.p}</p></div>`).join("")}</div>`,
  hsteps: s => `${head(s)}<div class="hsteps${s.cols >= 5 ? " c5" : ""}" style="grid-template-columns:repeat(${s.cols},1fr)">${s.steps.map((c, k) => `<div class="hstep"><div class="n">${String(k + 1).padStart(2, "0")}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join("")}</div>`,
  tool: s => `<div class="kicker">הכלים המרכזיים · במה הכלי טוב ומתי להשתמש בו</div>
    <div class="tool" style="--tc:${s.color}">
      <div class="id"><div class="mono">${s.mono}</div><div class="name">${s.name}</div><div class="by">${s.by}</div><p class="tagline">${s.tagline}</p></div>
      <div class="cols">
        <div class="box"><h3>במה הוא מצוין</h3><ul>${s.best.map(x => `<li>${x}</li>`).join("")}</ul></div>
        <div class="box"><h3>יכולות שכדאי להכיר</h3><ul>${s.use.map(x => `<li>${x}</li>`).join("")}</ul></div>
        <div class="tip">${s.tip}</div>
      </div></div>`,
  table: s => `${head(s)}<table class="tbl"><thead><tr>${s.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${s.rows.map(r => `<tr>${r.map((c, k) => `<td>${k === 1 && s.head[1] === "הכלי המומלץ" ? c.split(" · ").map(x => `<span class="pill">${x}</span>`).join("") : c}</td>`).join("")}</tr>`).join("")}</tbody></table>`,
  compare: s => `${head(s)}<div class="cmp">${[s.left, s.right].map(c => `<div class="col ${c.tone}"><h3>${c.h}</h3><ul>${c.items.map(x => `<li><span>${x}</span></li>`).join("")}</ul></div>`).join("")}</div>`,
  steps: s => `${head(s)}<div class="steps" style="grid-template-columns:repeat(${s.steps.length > 5 ? 2 : 1},1fr)">${s.steps.map((c, k) => `<div class="step"><div class="n">${k + 1}</div><div><h3>${c.h}</h3><p>${c.p}</p></div></div>`).join("")}</div>`,
  prompt: s => `${head(s)}<div class="pp"><div class="bad"><div class="lbl">✕ פרומפט חלש</div><div class="code">${s.bad}</div></div><div class="good"><div class="lbl">✓ פרומפט מקצועי</div><div class="code">${s.good}</div></div></div>`,
  promptbox: s => `${head(s)}<div class="pp" style="grid-template-columns:1.7fr 1fr"><div class="code${s.ltr ? " ltr" : ""}"${s.small ? ' style="font-size:19px;line-height:1.4;padding:18px 26px"' : s.ltr && s.code.split("\n").length > 14 ? ' style="font-size:21px;line-height:1.42;padding:22px 28px"' : ""}>${s.ltr ? hl(s.code) : s.code}</div><div class="side">${s.side.map(c => `<div class="chip"><span class="sw" style="background:${c.c}"></span><span><b>${c.h}</b>${c.p}</span></div>`).join("")}</div></div>`,
  twobox: s => `${head(s)}<div class="twobox">${s.boxes.map(b => `<div class="tb ${b.tone}"><h3>${b.h}</h3>${b.html}<p class="cap">${b.cap}</p></div>`).join("")}</div>`,
  chat: s => `${head(s)}<div class="chatwrap"><div class="msgs">${s.msgs.map(m => `<div class="msg ${m.who}"><span class="w">${m.who === "me" ? "את" : "המודל"}</span>${m.text}</div>`).join("")}</div><div class="side">${s.side.map(c => `<div class="chip"><span class="sw" style="background:${c.c}"></span><span><b>${c.h}</b>${c.p}</span></div>`).join("")}</div></div>`,
  lights: s => `${head(s)}<div class="lights">${s.cols.map(c => `<div class="light" style="--lc:${c.c === "good" ? "var(--good)" : c.c === "bad" ? "var(--bad)" : "var(--accent-2)"}"><div style="display:flex;align-items:center;gap:18px"><div class="lamp"></div><h3>${c.h}</h3></div><div class="role"><span>ה-AI</span><b>${c.ai}</b></div><div class="role"><span>את</span><b>${c.me}</b></div><p class="ex"><b>דוגמה: </b>${c.ex}</p></div>`).join("")}</div>`,
  q3: s => `${head(s)}<div class="q3"><div class="qq">${s.q}</div>${s.rows.map(r => `<div class="row" style="--lc:${r.c === "good" ? "var(--good)" : r.c === "bad" ? "var(--bad)" : "var(--accent-2)"}"><span class="ans">${r.ans}</span><span class="arr">${ARROW}</span><span class="res"><i></i>${r.res}</span><span class="what">${r.what}</span></div>`).join("")}${s.tip ? `<p class="qtip">${s.tip}</p>` : ""}</div>`,
  exx: s => `${head({ kicker: "תרגול מעשי " + s.n, title: s.title })}<div class="exx">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0"><div class="goal">${s.goal}</div><div>${s.steps.map(x => `<div class="srow"><div style="display:flex;flex-direction:column;gap:8px"><span class="time">${x.time}</span>${x.where ? `<span class="where ${x.where === "בדף" ? "paper" : "aitool"}">${x.where}</span>` : ""}</div><div><h3>${x.h}</h3><p>${x.p}</p></div></div>`).join("")}</div></div>
      <div style="display:flex;flex-direction:column;gap:20px;min-width:0"><div class="rbox del"><h3>מה מגישים בסוף</h3><p>${s.deliver}</p></div><div class="rbox chk"><h3>איך יודעים שהצלחת</h3><ul>${s.check.map(x => `<li>${x}</li>`).join("")}</ul></div></div></div>`,
  shot: s => `${head(s)}<div class="shot"><div class="stp">${s.steps.map((c, k) => `<div class="st"><div class="n">${c.n || k + 1}</div><div><h3>${c.h}</h3><p>${c.p}</p></div></div>`).join("")}</div><div class="scr">${s.screen}<p class="cap">${s.cap}</p></div></div>`,
  statement: s => `<p class="big">${s.big}</p><p class="small">${s.small}</p>`,
  matrix: s => `${head(s)}<div class="mx">
      <div class="ax y" style="grid-row:span 2">${s.ax.y}</div>
      ${s.quads.map(q => `<div class="q ${q.c}"><h3>${q.h}</h3><p>${q.p}</p></div>`).join("")}
      <div></div><div class="ax" style="grid-column:span 2">${s.ax.x}</div></div>`,
  flow: s => `${head(s)}<div class="flow">${s.nodes.map((n, k) => `${k ? `<div class="arrow">${ARROW}</div>` : ""}<div class="node ${n.k}"><div class="who">${n.who}</div><h3>${n.h}</h3>${n.p ? `<p>${n.p}</p>` : ""}${n.d ? `<div class="d">${n.d}</div>` : ""}</div>`).join("")}</div>
     ${s.legend ? `<div class="legend"><span><i style="background:var(--accent)"></i>שלב של AI</span><span><i style="background:var(--accent-2)"></i>שלב של אדם</span><span><i style="background:#c8b1ff"></i>שלב של קוד רגיל</span><span><i style="border:2px dashed var(--good)"></i>החלטה / ניתוב</span><span><i style="background:var(--panel2);border:1px solid var(--line)"></i>קלט / פלט</span></div>` : ""}`,
  tree: s => `${head(s)}<div style="display:flex;flex-direction:column;gap:26px;align-items:stretch">
      <div style="align-self:center;font-family:var(--f-display);font-size:44px;padding:22px 48px;border-radius:22px;background:linear-gradient(160deg,rgba(116,169,255,.25),var(--panel));border:1px solid rgba(116,169,255,.5)">${s.root}</div>
      <div style="height:3px;background:linear-gradient(90deg,transparent,var(--line) 10%,var(--line) 90%,transparent)"></div>
      <div class="grid" style="grid-template-columns:repeat(${s.branches.length},1fr)">${s.branches.map((b, k) => `<div class="card"><div class="tag" style="color:${k === s.branches.length - 1 ? "var(--accent-2)" : "var(--accent)"}">${String(k + 1).padStart(2, "0")}</div><h3>${b.h}</h3><p>${b.items.join("<br>")}</p></div>`).join("")}</div></div>`,
  exercise: s => `${head({ kicker: "תרגול מעשי " + s.n, title: s.title })}<div class="ex">
      <div style="display:flex;flex-direction:column;gap:24px"><div class="goal">${s.goal}</div><ul class="bul" style="font-size:31px;gap:14px">${s.steps.map(x => `<li><span>${x}</span></li>`).join("")}</ul></div>
      <div class="out"><span class="badge">התוצר</span><h3>מה מגישים בסוף</h3><p>${s.out}</p></div></div>`,
  end: () => `<p class="big">תודה.<br><em>ועכשיו — לעבודה.</em></p><p class="small">להביא למפגש הבא: טבלת המיפוי, תיקיית prompts, קובץ ההנחיות לפרויקט ותרשים ה-Mermaid.</p><p class="small" style="font-size:30px;color:var(--dim)">© כל הזכויות שמורות ל־TALYA TOLEDANO</p>`,
};
const stage = document.getElementById("stage");
stage.innerHTML = S.map((s, i) => {
  const cls = s.t === "cover" ? "cover" : s.t === "section" ? "section" : (s.t === "statement" || s.t === "end") ? "statement" + (s.t === "end" ? " end" : "") : "";
  return `<section class="slide ${cls}" data-i="${i}" aria-label="שקף ${i + 1}">${(R[s.t] || R.bullets)(s)}${s.t === "cover" ? "" : foot(s, i)}</section>`;
}).join("");
const slides = [...stage.querySelectorAll(".slide")];
let cur = 0;
const notesEl = document.getElementById("notes"), countEl = document.getElementById("count"), progEl = document.querySelector("#prog i");
function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, k) => el.classList.toggle("on", k === cur));
  countEl.textContent = `${cur + 1} / ${slides.length}`;
  progEl.style.width = `${((cur + 1) / slides.length) * 100}%`;
  notesEl.innerHTML = `<b>הערות מרצה · שקף ${cur + 1}:</b> ${S[cur].note || "—"}`;
  try { history.replaceState(null, "", "#s" + (cur + 1)); } catch (e) {}
  try { localStorage.setItem("deckSlide", String(cur)); } catch (e) {}
}
function fit() {
  const vp = document.getElementById("viewport");
  const k = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("prev").onclick = () => go(cur - 1);
const nb = document.getElementById("notesBtn");
function toggleNotes() { notesEl.hidden = !notesEl.hidden; nb.setAttribute("aria-pressed", String(!notesEl.hidden)); requestAnimationFrame(fit); }
nb.onclick = toggleNotes;
function toggleFs() { const d = document; if (!d.fullscreenElement) { (d.documentElement.requestFullscreen?.() || Promise.reject()).catch(() => {}); } else { d.exitFullscreen?.(); } }
document.getElementById("fsBtn").onclick = toggleFs;
document.addEventListener("keydown", e => {
  if (["ArrowLeft", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowRight", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(slides.length - 1);
  else if (e.key.toLowerCase() === "n") toggleNotes(); else if (e.key.toLowerCase() === "f") toggleFs();
});
stage.addEventListener("click", e => { const r = stage.getBoundingClientRect(); (e.clientX < r.left + r.width / 2) ? go(cur + 1) : go(cur - 1); });
let tx = null;
stage.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) go(dx > 0 ? cur + 1 : cur - 1); tx = null; });
addEventListener("resize", fit);
let start = 0;
const m = /^#s(\d+)$/.exec(location.hash);
if (m) start = +m[1] - 1; else { try { start = +(localStorage.getItem("deckSlide") || 0); } catch (e) {} }
fit(); go(start || 0);

/* cover: drifting neural network */
(function () {
  const cv = document.getElementById("net"); if (!cv) return;
  const ctx = cv.getContext("2d"); const W = 1920, H = 1080; cv.width = W; cv.height = H;
  const N = 70, P = [];
  for (let i = 0; i < N; i++) P.push({ x: Math.random() * W * 0.62, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35, p: Math.random() * 6.28 });
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const a of P) { if (!still) { a.x += a.vx; a.y += a.vy; } if (a.x < 0 || a.x > W * 0.65) a.vx *= -1; if (a.y < 0 || a.y > H) a.vy *= -1; }
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = P[i], b = P[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 210) { ctx.strokeStyle = `rgba(116,169,255,${(1 - d / 210) * .35})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const a of P) { const pu = .5 + .5 * Math.sin(t / 700 + a.p); ctx.fillStyle = `rgba(184,210,255,${.35 + .5 * pu})`; ctx.beginPath(); ctx.arc(a.x, a.y, 2 + 2 * pu, 0, 6.28); ctx.fill(); }
    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
